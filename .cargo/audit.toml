# cargo-audit configuration
# https://rustsec.org/

[advisories]
ignore = [
    # wasmtime vulns via extism — no upstream fix; plugins feature-gated
    "RUSTSEC-2026-0006",  # wasmtime f64.copysign segfault on x86-64
    "RUSTSEC-2026-0020",  # WASI guest-controlled resource exhaustion
    "RUSTSEC-2026-0021",  # WASI http fields panic
    "RUSTSEC-2026-0085",  # wasmtime component flags lifting panic
    "RUSTSEC-2026-0086",  # wasmtime Winch host data leakage
    "RUSTSEC-2026-0087",  # wasmtime Cranelift x86-64 out-of-sandbox load
    "RUSTSEC-2026-0088",  # wasmtime pooling allocator data leakage
    "RUSTSEC-2026-0089",  # wasmtime Winch table.fill host panic
    "RUSTSEC-2026-0091",  # wasmtime component string transcoding OOB write/crash
    "RUSTSEC-2026-0092",  # wasmtime misaligned UTF-16 string panic
    "RUSTSEC-2026-0093",  # wasmtime component string transcoding heap OOB read
    "RUSTSEC-2026-0094",  # wasmtime Winch table.grow return masking
    "RUSTSEC-2026-0095",  # wasmtime Winch sandbox-escaping memory access
    "RUSTSEC-2026-0096",  # wasmtime aarch64 Cranelift sandbox escape
    # instant crate unmaintained — transitive dep via nostr; no upstream fix
    "RUSTSEC-2024-0384",
]
